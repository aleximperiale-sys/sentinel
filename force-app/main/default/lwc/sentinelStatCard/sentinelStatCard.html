<template>
    <article class={cardClass}>
        <!-- Per-card loading: same box as the loaded card, so nothing reflows. -->
        <template lwc:if={loading}>
            <div class="sc__state">
                <c-sentinel-skeleton variant="cards" count="1" loading-text="Loading object health"></c-sentinel-skeleton>
            </div>
        </template>

        <template lwc:elseif={error}>
            <div class="sc__state">
                <c-sentinel-error-state
                    headline={errorTitle}
                    friendly-message={error}
                    show-retry
                    onretry={handleRetry}
                ></c-sentinel-error-state>
            </div>
        </template>

        <template lwc:else>
            <header class="sc__head">
                <div class="sc__ident">
                    <h2 class="sc__label">{card.label}</h2>
                    <p class="sc__object">{card.objectApiName}</p>
                </div>
                <div class="sc__count">
                    <span class="sc__numeral">{card.staleCount}</span>
                    <span class="sc__numeral-cap">at risk</span>
                </div>
            </header>

            <!-- Healthy object: the watchdog found nothing, which is a pass. -->
            <template lwc:if={isClear}>
                <div class="sc__clear">
                    <c-sentinel-status-badge severity="success" label="All clear"></c-sentinel-status-badge>
                    <p class="sc__clear-text">{clearText}</p>
                </div>
            </template>

            <template lwc:else>
                <div class="sc__bands">
                    <c-sentinel-band-bar
                        segments={card.bands}
                        total={card.staleCount}
                        unit-label="at-risk records"
                    ></c-sentinel-band-bar>
                </div>

                <template lwc:if={card.trend}>
                    <p class={trendClass}>
                        <lightning-icon
                            icon-name={card.trend.icon}
                            size="xx-small"
                            class="sc__trend-icon"
                            alternative-text={card.trend.direction}
                        ></lightning-icon>
                        <span class="sc__trend-value">{card.trend.text}</span>
                        <span class="sc__trend-note">{card.trend.note}</span>
                    </p>
                </template>
            </template>

            <footer class="sc__foot">
                <c-sentinel-status-badge
                    severity="info"
                    label={thresholdLabel}
                    tooltip="Records count as at risk once the tracked date is older than this."
                ></c-sentinel-status-badge>
                <template lwc:if={hasOwners}>
                    <p class="sc__owner">
                        <span class="sc__owner-key">Top owner</span>
                        <span class="sc__owner-name">{topOwner.key}</span>
                        <span class="sc__owner-count">{topOwner.count}</span>
                    </p>
                </template>
            </footer>

            <template lwc:if={hasRecords}>
                <div class="sc__expand">
                    <button class="sc__toggle" type="button" aria-expanded={expandedAttr} onclick={toggleRecords}>
                        <lightning-icon
                            icon-name={toggleIcon}
                            size="xx-small"
                            class="sc__toggle-icon"
                            alternative-text=""
                        ></lightning-icon>
                        <span>{toggleLabel}</span>
                    </button>

                    <template lwc:if={expanded}>
                        <ul class="sc__records">
                            <template for:each={card.records} for:item="rec">
                                <li class="sc__record" key={rec.id}>
                                    <a class="sc__record-link" href={rec.url} title={rec.explanation}>{rec.name}</a>
                                    <span class="sc__record-meta">
                                        <c-sentinel-status-badge
                                            severity={rec.severity}
                                            label={rec.band}
                                            compact
                                        ></c-sentinel-status-badge>
                                        <span class="sc__record-age">{rec.ageText}</span>
                                    </span>
                                </li>
                            </template>
                        </ul>
                        <template lwc:if={card.moreCount}>
                            <p class="sc__more">{moreText}</p>
                        </template>
                    </template>
                </div>
            </template>
        </template>
    </article>
</template>
