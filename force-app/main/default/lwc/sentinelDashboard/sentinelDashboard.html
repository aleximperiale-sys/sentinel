<template>
    <div class="page">
        <c-sentinel-section-header
            eyebrow="SENTINEL · CONTROL ROOM"
            icon-name="utility:monitor"
            headline="Record Health Radar"
            description="Every watched object, scored by how long its records have sat idle. Critical means past three times the configured threshold."
            readout-value={readoutValue}
            readout-label="critical now"
        >
            <div slot="actions">
                <lightning-button
                    variant="inverse"
                    label={refreshLabel}
                    icon-name="utility:refresh"
                    disabled={refreshing}
                    onclick={handleRefresh}
                ></lightning-button>
            </div>
        </c-sentinel-section-header>

        <!-- Scope control strip -->
        <div class="strip">
            <lightning-radio-group
                name="ownerScope"
                label="Owner scope"
                variant="label-hidden"
                type="button"
                options={scopeOptions}
                value={scope}
                onchange={handleScopeChange}
            ></lightning-radio-group>
            <p class="strip__note" aria-live="polite">{scopeNote}</p>
        </div>

        <!-- Initial load: skeletons occupy the exact hero + card boxes -->
        <template lwc:if={showSkeleton}>
            <div class="slds-m-top_small">
                <c-sentinel-skeleton variant="hero" loading-text="Loading record health"></c-sentinel-skeleton>
            </div>
            <div class="slds-m-top_small">
                <c-sentinel-skeleton variant="cards" count="4" loading-text="Loading watched objects"></c-sentinel-skeleton>
            </div>
        </template>

        <template lwc:elseif={showError}>
            <div class="slds-m-top_small">
                <c-sentinel-error-state
                    headline="Record health could not load"
                    friendly-message={errorMessage}
                    technical-detail={errorDetail}
                    show-retry
                    retrying={refreshing}
                    onretry={handleRefresh}
                ></c-sentinel-error-state>
            </div>
        </template>

        <template lwc:elseif={showEmpty}>
            <div class="slds-m-top_small">
                <c-sentinel-empty-state
                    tone="success"
                    headline={emptyTitle}
                    message={emptyMessage}
                    next-step="Nothing to action right now. Switch scope to All to see the whole team, or re-check after the daily monitor runs."
                    action-label="Refresh"
                    action-icon="utility:refresh"
                    onaction={handleRefresh}
                ></c-sentinel-empty-state>
            </div>
        </template>

        <template lwc:else>
            <!-- Hero scoreboard. Critical is the decision the user came here to make. -->
            <section class="hero fade-in" aria-labelledby="hero-heading">
                <div class="hero__score">
                    <h2 class="hero__score-label" id="hero-heading">Critical now</h2>
                    <p class="hero__numeral">{criticalTotal}</p>
                    <p class="hero__support">{criticalSupport}</p>
                    <template lwc:if={overallTrend}>
                        <p class={overallTrendClass}>
                            <lightning-icon
                                icon-name={overallTrend.icon}
                                size="xx-small"
                                class="hero__trend-icon"
                                alternative-text={overallTrend.direction}
                            ></lightning-icon>
                            <span>{overallTrend.text}</span>
                        </p>
                    </template>
                </div>

                <div class="hero__gauge">
                    <c-sentinel-gauge
                        value={criticalSharePct}
                        severity={criticalShareSeverity}
                        size="medium"
                        label="Critical share"
                        caption={gaugeCaption}
                    ></c-sentinel-gauge>
                </div>

                <div class="hero__tiles">
                    <div class="tile">
                        <p class="tile__label">Records at risk</p>
                        <p class="tile__value">{total}</p>
                        <div class="tile__bar">
                            <c-sentinel-band-bar
                                segments={aggregateBands}
                                total={total}
                                thick
                                unit-label="at-risk records"
                            ></c-sentinel-band-bar>
                        </div>
                    </div>
                    <div class="tile tile--split">
                        <div class="tile__cell">
                            <p class="tile__label">Objects watched</p>
                            <p class="tile__value tile__value--sm">{objectCount}</p>
                        </div>
                        <div class="tile__cell">
                            <p class="tile__label">Worst object</p>
                            <p class="tile__text">{worstObjectLabel}</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Per-object KPI cards -->
            <section class="slds-m-top_small" aria-label="Watched objects">
                <div class="grid">
                    <template for:each={cards} for:item="card">
                        <c-sentinel-stat-card key={card.key} card={card}></c-sentinel-stat-card>
                    </template>
                </div>
            </section>

            <p class="footnote">
                Freshness bands are multiples of each object's configured idle threshold: Aging at 1×, Stale at 2×,
                Critical at 3×. Up to 200 records are inspected per object.
            </p>
        </template>
    </div>
</template>
